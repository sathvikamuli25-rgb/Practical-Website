<!DOCTYPE html>
<html>
<head>
    <title>Personal Portfolio</title>

    <style>
        body {
            font-family: Arial;
            margin: 0;
            background-color: #f2f2f2;
        }

        header {
            background-color: #333;
            color: white;
            text-align: center;
            padding: 30px;
        }

        section {
            background-color: white;
            margin: 20px;
            padding: 20px;
            border-radius: 10px;
        }

        h2 {
            color: #333;
        }

        footer {
            background-color: #333;
            color: white;
            text-align: center;
            padding: 15px;
        }
    </style>
</head>
<body>

    <header>
        <h1>My Portfolio</h1>
        <p>Student | Web Developer</p>
    </header>

    <section>
        <h2>About Me</h2>
        <p>I am a student interested in web development.</p>
    </section>

    <section>
        <h2>Skills</h2>
        <ul>
            <li>HTML</li>
            <li>CSS</li>
            <li>JavaScript</li>
        </ul>
    </section>

    <section>
        <h2>Projects</h2>
        <p>Student Registration Form</p>
        <p>College Timetable</p>
    </section>

    <section>
        <h2>Contact</h2>
        <p>Email: student@example.com</p>
    </section>

    <footer>
        <p>© 2026 My Portfolio</p>
    </footer>

</body>
</html>
