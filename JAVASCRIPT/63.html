<!DOCTYPE html>
<html>
<head>
    <title>Vowels and Consonants</title>
</head>
<body>

<script>
let text = "javascript";
let vowels = 0;
let consonants = 0;

for (let char of text) {
    if ("aeiou".includes(char)) {
        vowels++;
    } else {
        consonants++;
    }
}

document.write("Vowels: " + vowels + "<br>");
document.write("Consonants: " + consonants);
</script>

</body>
</html>
