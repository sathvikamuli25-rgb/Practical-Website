<!DOCTYPE html>
<html>
<head>
    <title>JavaScript Object</title>
</head>
<body>

<script>
    let student = {
        name: "Sathvika",
        age: 20,
        course: "B.Tech"
    };

    document.write("Name: " + student.name + "<br>");
    document.write("Age: " + student.age + "<br>");
    document.write("Course: " + student.course);
</script>

</body>
</html>
