<!DOCTYPE html>
<html>
<head>
    <title>Armstrong Number</title>
</head>
<body>

<script>
let num = 153;
let original = num;
let sum = 0;

while (num > 0) {
    let digit = num % 10;
    sum = sum + digit * digit * digit;
    num = Math.floor(num / 10);
}

if (sum == original) {
    document.write("Armstrong number");
} else {
    document.write("Not an Armstrong number");
}
</script>

</body>
</html>
