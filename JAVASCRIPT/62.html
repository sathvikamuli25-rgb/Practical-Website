<!DOCTYPE html>
<html>
<head>
    <title>String Palindrome</title>
</head>
<body>

<script>
let text = "madam";

let reverse = text.split("").reverse().join("");

if (text == reverse) {
    document.write("Palindrome");
} else {
    document.write("Not a palindrome");
}
</script>

</body>
</html>
