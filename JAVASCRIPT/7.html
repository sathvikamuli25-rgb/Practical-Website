<!DOCTYPE html>
<html>
<head>
    <title>Fibonacci Series</title>
</head>
<body>

<script>
    let n = 10;
    let a = 0;
    let b = 1;

    for (let i = 1; i <= n; i++) {
        document.write(a + " ");
        let c = a + b;
        a = b;
        b = c;
    }
</script>

</body>
</html>
