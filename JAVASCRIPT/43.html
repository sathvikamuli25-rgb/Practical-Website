<!DOCTYPE html>
<html>
<head>
    <title>Fetch API</title>
</head>
<body>

<h2 id="result"></h2>

<script>
fetch("https://jsonplaceholder.typicode.com/todos/1")
    .then(response => response.json())
    .then(data => {
        document.getElementById("result").innerHTML = data.title;
    });
</script>

</body>
</html>
