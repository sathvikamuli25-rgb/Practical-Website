<!DOCTYPE html>
<html>
<head>
    <title>Reverse Number</title>
</head>
<body>

<script>
    let num = 12345;
    let reverse = 0;

    while (num > 0) {
        let digit = num % 10;
        reverse = reverse * 10 + digit;
        num = Math.floor(num / 10);
    }

    document.write("Reverse: " + reverse);
</script>

</body>
</html>
