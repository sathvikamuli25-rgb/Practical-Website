<!DOCTYPE html>
<html>
<head>
    <title>Stopwatch</title>
</head>
<body>

<h1 id="time">0</h1>

<button onclick="start()">Start</button>
<button onclick="stop()">Stop</button>
<button onclick="reset()">Reset</button>

<script>
let time = 0;
let timer;

function start() {
    timer = setInterval(function() {
        time++;
        document.getElementById("time").innerHTML = time;
    }, 1000);
}

function stop() {
    clearInterval(timer);
}

function reset() {
    clearInterval(timer);
    time = 0;
    document.getElementById("time").innerHTML = time;
}
</script>

</body>
</html>
