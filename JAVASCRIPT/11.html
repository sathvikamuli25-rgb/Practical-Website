<!DOCTYPE html>
<html>
<head>
    <title>Sum of Digits</title>
</head>
<body>

<script>
    let num = 12345;
    let sum = 0;

    while (num > 0) {
        let digit = num % 10;
        sum = sum + digit;
        num = Math.floor(num / 10);
    }

    document.write("Sum of digits: " + sum);
</script>

</body>
</html>
