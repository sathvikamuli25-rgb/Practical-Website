<!DOCTYPE html>
<html>
<head>
    <title>JavaScript Program</title>
    <link rel="stylesheet" href="viewer-style.css">
</head>

<body>

<header>
    <a href="index.html">← Back to JavaScript Programs</a>
    <h1 id="title">JavaScript Program</h1>
</header>

<div class="tabs">
    <button onclick="showCode()">Source Code</button>
    <button onclick="showOutput()">Output</button>
</div>

<div class="container">

    <div id="codeBox">
        <pre id="code"></pre>
    </div>

    <div id="outputBox">
        <iframe id="output"></iframe>
    </div>

</div>

<script>
const params = new URLSearchParams(window.location.search);
const file = params.get("file");

if (file) {

    const number = file.replace(".html", "");

    document.getElementById("title").textContent =
        "JavaScript Program " + number;

    fetch(file)
        .then(response => {
            if (!response.ok) {
                throw new Error("File not found");
            }

            return response.text();
        })
        .then(data => {
            document.getElementById("code").textContent = data;
        })
        .catch(error => {
            document.getElementById("code").textContent =
                "Unable to load source code.";
        });

    document.getElementById("output").src = file;
}

function showCode() {
    document.getElementById("codeBox").style.display = "block";
    document.getElementById("outputBox").style.display = "none";
}

function showOutput() {
    document.getElementById("codeBox").style.display = "none";
    document.getElementById("outputBox").style.display = "block";
}

showCode();
</script>

</body>
</html>
