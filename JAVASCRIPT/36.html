<!DOCTYPE html>
<html>
<head>
    <title>Countdown</title>
</head>
<body>

<h1 id="count">10</h1>

<script>
let time = 10;

let timer = setInterval(function() {
    document.getElementById("count").innerHTML = time;
    time--;

    if (time < 0) {
        clearInterval(timer);
        document.getElementById("count").innerHTML = "Time's Up!";
    }
}, 1000);
</script>

</body>
</html>
