<!DOCTYPE html>

</head>
<body>

<script>
let name = "Sathvika";
const age = 20;

let message = `My name is ${name} and I am ${age} years old.`;

let student = ["Sathvika", 20];
let [studentName, studentAge] = student;

document.write(message + "<br>");
document.write("Name: " + studentName + "<br>");
document.write("Age: " + studentAge);
</script>

</body>
