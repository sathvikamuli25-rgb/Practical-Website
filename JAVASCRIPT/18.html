<!DOCTYPE html>
<html>
<head>
    <title>Array Methods</title>
</head>
<body>

<script>
    let fruits = ["Apple", "Banana", "Mango"];

    fruits.push("Orange");

    document.write("Array: " + fruits + "<br>");
    document.write("Length: " + fruits.length + "<br>");
    document.write("First fruit: " + fruits[0]);
</script>

</body>
</html>
