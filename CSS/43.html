<!DOCTYPE html>
<html>
<head>
    <title>CSS Filters</title>

    <style>
        .image {
            width: 300px;
            filter: grayscale(100%);
        }

        .image:hover {
            filter: grayscale(0%);
        }
    </style>
</head>

<body>

    <h1>CSS Filters</h1>

    <img class="image" src="https://picsum.photos/300/200" alt="Sample Image">

</body>
</html>
