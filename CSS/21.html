<!DOCTYPE html>
<html>
<head>
    <title>College Student Profile</title>

    <style>
        body {
            font-family: Arial;
            background-color: #f2f2f2;
        }

        .profile {
            width: 400px;
            margin: 50px auto;
            padding: 25px;
            background-color: white;
            text-align: center;
            border-radius: 15px;
            box-shadow: 0 0 10px gray;
        }

        .profile h1 {
            color: #333;
        }

        .profile h2 {
            color: #0066cc;
        }

        .profile p {
            color: #555;
            font-size: 17px;
        }
    </style>
</head>

<body>

    <div class="profile">
        <h1>Student Profile</h1>
        <h2>Sathvika</h2>
        <p>Course: B.Tech</p>
        <p>Department: Computer Science</p>
        <p>Year: 2</p>
        <p>College: ABC College</p>
    </div>

</body>
</html>
