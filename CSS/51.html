<!DOCTYPE html>
<html>
<head>
    <title>Fixed Sidebar</title>

    <style>
        body {
            margin: 0;
            font-family: Arial;
        }

        .sidebar {
            position: fixed;
            left: 0;
            top: 0;
            width: 200px;
            height: 100%;
            background-color: blue;
            color: white;
            padding: 20px;
        }

        .content {
            margin-left: 240px;
            padding: 30px;
            height: 1000px;
        }

        .sidebar a {
            display: block;
            color: white;
            text-decoration: none;
            padding: 15px 0;
        }
    </style>
</head>

<body>

    <div class="sidebar">
        <h2>Menu</h2>
        <a href="#">Home</a>
        <a href="#">About</a>
        <a href="#">Services</a>
        <a href="#">Contact</a>
    </div>

    <div class="content">
        <h1>Fixed Sidebar</h1>
        <p>The sidebar remains fixed while scrolling.</p>
        <p>Scroll down to see the effect.</p>
    </div>

</body>
</html>
