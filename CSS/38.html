<!DOCTYPE html>
<html>
<head>
    <title>CSS Visibility</title>

    <style>
        .visible {
            visibility: visible;
            background-color: lightblue;
            padding: 20px;
            margin: 10px;
        }

        .hidden {
            visibility: hidden;
            background-color: lightcoral;
            padding: 20px;
            margin: 10px;
        }
    </style>
</head>

<body>

    <h1>CSS Visibility</h1>

    <div class="visible">
        Visible Element
    </div>

    <div class="hidden">
        Hidden Element
    </div>

    <div class="visible">
        Another Visible Element
    </div>

</body>
</html>
