<!DOCTYPE html>
<html>
<head>
<style>
    img {
        width: 120px;
        float: left;
        margin-right: 15px;
    }

    .clear {
        clear: both;
    }
</style>
</head>

<body>

<img src="image.jpg">

<p>
    This text appears beside the image because the image is floated left.
</p>

<p class="clear">
    This paragraph starts below the floated image.
</p>

</body>
</html>
