<!DOCTYPE html>
<html>
<head>
    <title>Restaurant Webpage</title>

    <style>
        body {
            margin: 0;
            font-family: Arial;
        }

        header {
            background-color: brown;
            color: white;
            text-align: center;
            padding: 30px;
        }

        .menu {
            display: flex;
            justify-content: center;
            gap: 20px;
            padding: 30px;
            flex-wrap: wrap;
        }

        .card {
            width: 250px;
            padding: 20px;
            background-color: #f5f5f5;
            text-align: center;
            border-radius: 10px;
        }

        .card img {
            width: 100%;
            height: 150px;
            object-fit: cover;
            border-radius: 10px;
        }

        footer {
            background-color: brown;
            color: white;
            text-align: center;
            padding: 20px;
        }

        @media (max-width: 600px) {
            .card {
                width: 90%;
            }
        }
    </style>
</head>

<body>

    <header>
        <h1>Delicious Restaurant</h1>
        <p>Fresh Food, Great Taste</p>
    </header>

    <div class="menu">

        <div class="card">
            <img src="https://picsum.photos/250/150?1" alt="Pizza">
            <h2>Pizza</h2>
            <p>₹250</p>
        </div>

        <div class="card">
            <img src="https://picsum.photos/250/150?2" alt="Burger">
            <h2>Burger</h2>
            <p>₹150</p>
        </div>

        <div class="card">
            <img src="https://picsum.photos/250/150?3" alt="Pasta">
            <h2>Pasta</h2>
            <p>₹200</p>
        </div>

    </div>

    <footer>
        <p>© 2026 Delicious Restaurant</p>
    </footer>

</body>
</html>
