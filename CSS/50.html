<!DOCTYPE html>
<html>
<head>
    <title>Sticky Header</title>

    <style>
        body {
            margin: 0;
            font-family: Arial;
        }

        header {
            position: sticky;
            top: 0;
            background-color: blue;
            color: white;
            padding: 20px;
            text-align: center;
        }

        .content {
            height: 1000px;
            padding: 30px;
        }
    </style>
</head>

<body>

    <header>
        Sticky Header
    </header>

    <div class="content">
        <h1>Sticky Header Example</h1>
        <p>Scroll down to see the header remain at the top.</p>
        <p>This page demonstrates the CSS sticky position.</p>
    </div>

</body>
</html>
