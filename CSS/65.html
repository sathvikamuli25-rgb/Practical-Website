<!DOCTYPE html>
<html>
<head>
    <title>CSS 2D and 3D Transforms</title>

    <style>
        .container {
            display: flex;
            gap: 50px;
            justify-content: center;
            margin-top: 100px;
        }

        .box {
            width: 150px;
            height: 100px;
            background-color: lightblue;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: 0.5s;
        }

        .two-d:hover {
            transform: rotate(20deg) scale(1.2);
        }

        .three-d:hover {
            transform: rotateY(180deg);
        }
    </style>
</head>

<body>

    <h1>CSS 2D and 3D Transforms</h1>

    <div class="container">

        <div class="box two-d">
            2D Transform
        </div>

        <div class="box three-d">
            3D Transform
        </div>

    </div>

</body>
</html>
