<!DOCTYPE html>
<html>
<head>
    <title>News and Blog Grid</title>

    <style>
        body {
            margin: 0;
            font-family: Arial;
        }

        h1 {
            text-align: center;
            padding: 20px;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            padding: 30px;
        }

        .article {
            border: 1px solid gray;
            border-radius: 10px;
            overflow: hidden;
            background-color: white;
        }

        .article img {
            width: 100%;
            height: 180px;
            object-fit: cover;
        }

        .content {
            padding: 20px;
        }

        .content h2 {
            color: blue;
        }

        @media (max-width: 800px) {
            .grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (max-width: 500px) {
            .grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

    <h1>News and Blog</h1>

    <div class="grid">

        <div class="article">
            <img src="https://picsum.photos/400/250?1" alt="News">
            <div class="content">
                <h2>Technology</h2>
                <p>Latest updates in technology and innovation.</p>
            </div>
        </div>

        <div class="article">
            <img src="https://picsum.photos/400/250?2" alt="News">
            <div class="content">
                <h2>Education</h2>
                <p>New trends and developments in education.</p>
            </div>
        </div>

        <div class="article">
            <img src="https://picsum.photos/400/250?3" alt="News">
            <div class="content">
                <h2>Travel</h2>
                <p>Explore interesting destinations around the world.</p>
            </div>
        </div>

    </div>

</body>
</html>
