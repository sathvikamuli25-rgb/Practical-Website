<!DOCTYPE html>
<html>
<head>
    <title>Dashboard Using Grid</title>

    <style>
        .dashboard {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            padding: 20px;
        }

        .card {
            background-color: lightblue;
            padding: 30px;
            text-align: center;
            border-radius: 10px;
        }

        @media (max-width: 600px) {
            .dashboard {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

    <h1>Dashboard</h1>

    <div class="dashboard">
        <div class="card">Students</div>
        <div class="card">Courses</div>
        <div class="card">Teachers</div>
        <div class="card">Departments</div>
        <div class="card">Exams</div>
        <div class="card">Results</div>
    </div>

</body>
</html>
