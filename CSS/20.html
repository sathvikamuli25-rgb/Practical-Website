<!DOCTYPE html>
<html>
<head>
    <title>Personal Portfolio</title>

    <style>
        body {
            margin: 0;
            font-family: Arial;
            background-color: #f2f2f2;
        }

        header {
            background-color: #333;
            color: white;
            text-align: center;
            padding: 30px;
        }

        nav {
            background-color: #222;
            text-align: center;
            padding: 15px;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin: 20px;
        }

        section {
            background-color: white;
            margin: 20px;
            padding: 25px;
            border-radius: 10px;
        }

        h2 {
            color: #333;
        }

        footer {
            background-color: #333;
            color: white;
            text-align: center;
            padding: 15px;
        }
    </style>
</head>

<body>

    <header>
        <h1>My Portfolio</h1>
        <p>Web Developer</p>
    </header>

    <nav>
        <a href="#about">About</a>
        <a href="#skills">Skills</a>
        <a href="#projects">Projects</a>
        <a href="#contact">Contact</a>
    </nav>

    <section id="about">
        <h2>About Me</h2>
        <p>I am a student interested in web development.</p>
    </section>

    <section id="skills">
        <h2>Skills</h2>
        <ul>
            <li>HTML</li>
            <li>CSS</li>
            <li>JavaScript</li>
        </ul>
    </section>

    <section id="projects">
        <h2>Projects</h2>
        <p>Student Registration Form</p>
        <p>College Timetable</p>
    </section>

    <section id="contact">
        <h2>Contact</h2>
        <p>Email: student@example.com</p>
    </section>

    <footer>
        <p>© 2026 My Portfolio</p>
    </footer>

</body>
</html>
