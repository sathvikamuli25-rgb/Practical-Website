<!DOCTYPE html>

<head>
<style>
    a:hover {
        color: red;
    }

    a:active {
        color: green;
    }

    a:focus {
        background-color: yellow;
    }

    a:visited {
        color: purple;
    }
</style>
</head>

<body>

<a href="https://example.com">Click Here</a>

</html>
