<!DOCTYPE html>
<html>
<head>
    <title>CSS Modal Popup</title>

    <style>
        .button {
            padding: 12px 20px;
            background-color: blue;
            color: white;
            text-decoration: none;
            display: inline-block;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.5);
        }

        .modal:target {
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .content {
            background-color: white;
            padding: 30px;
            width: 300px;
            text-align: center;
            border-radius: 10px;
        }

        .close {
            color: red;
            text-decoration: none;
        }
    </style>
</head>

<body>

    <h1>CSS-Only Modal Popup</h1>

    <a href="#popup" class="button">Open Popup</a>

    <div id="popup" class="modal">
        <div class="content">
            <h2>Welcome!</h2>
            <p>This popup is created using only CSS.</p>
            <a href="#" class="close">Close</a>
        </div>
    </div>

</body>
</html>
