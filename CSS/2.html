<!DOCTYPE html>
<html>
<head>
<style>
    /* Element selector */
    p {
        color: blue;
    }

    /* Class selector */
    .red {
        color: red;
    }

    /* ID selector */
    #heading {
        color: green;
    }

    /* Universal selector */
    * {
        font-family: Arial;
    }
</style>
</head>

<body>

<h1 id="heading">ID Selector</h1>
<p>Element Selector</p>
<p class="red">Class Selector</p>

</body>
</html>
