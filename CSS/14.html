<!DOCTYPE html>
<html>
<head>
<style>
    .container {
        display: flex;
        justify-content: space-around;
        align-items: center;
        height: 200px;
        background-color: lightgray;
    }

    .box {
        width: 80px;
        padding: 20px;
        background-color: lightblue;
        text-align: center;
    }
</style>
</head>

<body>

<div class="container">
    <div class="box">One</div>
    <div class="box">Two</div>
    <div class="box">Three</div>
</div>

</body>
</html>
