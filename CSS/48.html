<!DOCTYPE html>
<html>
<head>
    <title>Two Column Grid</title>

    <style>
        .container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            padding: 20px;
        }

        .box {
            background-color: lightblue;
            padding: 40px;
            text-align: center;
            border-radius: 10px;
        }

        @media (max-width: 600px) {
            .container {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

    <h1>Two Column Grid</h1>

    <div class="container">
        <div class="box">Column 1</div>
        <div class="box">Column 2</div>
        <div class="box">Column 3</div>
        <div class="box">Column 4</div>
    </div>

</body>
</html>
