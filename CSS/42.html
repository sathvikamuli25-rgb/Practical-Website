<!DOCTYPE html>
<html>
<head>
    <title>CSS Button Hover Animation</title>

    <style>
        .button {
            padding: 15px 30px;
            background-color: blue;
            color: white;
            border: none;
            cursor: pointer;
            transition: 0.3s;
        }

        .button:hover {
            transform: scale(1.1);
            background-color: purple;
        }
    </style>
</head>

<body>

    <h1>CSS Button Hover Animation</h1>

    <button class="button">Hover Me</button>

</body>
</html>
