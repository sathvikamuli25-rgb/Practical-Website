<!DOCTYPE html>
<html>
<head>
    <title>Card Layout Using Flexbox</title>

    <style>
        .container {
            display: flex;
            gap: 20px;
            justify-content: center;
        }

        .card {
            width: 200px;
            padding: 20px;
            background-color: lightblue;
            text-align: center;
            border-radius: 10px;
        }
    </style>
</head>

<body>

    <h1>Card Layout</h1>

    <div class="container">
        <div class="card">
            <h2>HTML</h2>
            <p>Structure of webpage</p>
        </div>

        <div class="card">
            <h2>CSS</h2>
            <p>Design of webpage</p>
        </div>

        <div class="card">
            <h2>JavaScript</h2>
            <p>Functionality of webpage</p>
        </div>
    </div>

</body>
</html>
