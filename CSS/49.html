<!DOCTYPE html>
<html>
<head>
    <title>Three Column Flexbox</title>

    <style>
        .container {
            display: flex;
            gap: 20px;
            padding: 20px;
        }

        .column {
            flex: 1;
            background-color: lightblue;
            padding: 40px;
            text-align: center;
            border-radius: 10px;
        }

        @media (max-width: 600px) {
            .container {
                flex-direction: column;
            }
        }
    </style>
</head>

<body>

    <h1>Three Column Flexbox</h1>

    <div class="container">
        <div class="column">Column 1</div>
        <div class="column">Column 2</div>
        <div class="column">Column 3</div>
    </div>

</body>
</html>
