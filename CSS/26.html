<!DOCTYPE html>
<html>
<head>
    <title>Inheritance and Specificity</title>

    <style>
        body {
            color: blue;
            font-family: Arial;
        }

        p {
            color: green;
        }

        .text {
            color: orange;
        }

        #special {
            color: red;
        }
    </style>
</head>

<body>

    <h1>CSS Inheritance and Specificity</h1>

    <div>
        <p>This paragraph inherits the font from the body.</p>
        <p class="text">Class selector has higher specificity.</p>
        <p id="special" class="text">ID selector has the highest specificity here.</p>
    </div>

</body>
</html>
