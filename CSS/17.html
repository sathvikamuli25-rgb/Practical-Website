<!DOCTYPE html>
<html>
<head>
<style>
    .box {
        width: 100px;
        height: 100px;
        background-color: lightblue;
        transition: 1s;
    }

    .box:hover {
        transform: rotate(20deg) scale(1.2);
    }
</style>
</head>

<body>

<div class="box"></div>

</body>
</html>
