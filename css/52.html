<!DOCTYPE html>
<html>
<head>
    <title>Responsive Footer</title>

    <style>
        body {
            margin: 0;
            font-family: Arial;
        }

        .content {
            height: 500px;
            padding: 30px;
        }

        footer {
            background-color: black;
            color: white;
            padding: 30px;
            display: flex;
            justify-content: space-around;
            text-align: center;
        }

        @media (max-width: 600px) {
            footer {
                flex-direction: column;
                gap: 15px;
            }
        }
    </style>
</head>

<body>

    <div class="content">
        <h1>Responsive Footer</h1>
        <p>This is the main content of the webpage.</p>
    </div>

    <footer>
        <div>About Us</div>
        <div>Contact</div>
        <div>Follow Us</div>
    </footer>

</body>
</html>
