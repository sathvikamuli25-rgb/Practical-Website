<!DOCTYPE html>
<html>
<head>
    <title>CSS Border Radius</title>

    <style>
        .box {
            width: 300px;
            padding: 40px;
            margin: 50px auto;
            background-color: lightblue;
            text-align: center;
            border-radius: 20px;
        }

        .circle {
            width: 150px;
            height: 150px;
            margin: 30px auto;
            background-color: orange;
            border-radius: 50%;
        }
    </style>
</head>

<body>

    <h1>CSS Border Radius</h1>

    <div class="box">
        Rounded Rectangle
    </div>

    <div class="circle"></div>

</body>
</html>
