<!DOCTYPE html>
<html>
<head>
    <title>Product Card</title>

    <style>
        body {
            font-family: Arial;
            background-color: #f2f2f2;
        }

        .card {
            width: 300px;
            margin: 60px auto;
            background-color: white;
            padding: 20px;
            text-align: center;
            border-radius: 10px;
            box-shadow: 0 0 10px gray;
        }

        .product-image {
            height: 180px;
            background-color: #ddd;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 8px;
        }

        .card h2 {
            color: #333;
        }

        .price {
            color: green;
            font-size: 22px;
            font-weight: bold;
        }

        button {
            padding: 10px 25px;
            background-color: #333;
            color: white;
            border: none;
            border-radius: 5px;
        }

        button:hover {
            background-color: #555;
        }
    </style>
</head>

<body>

    <div class="card">
        <div class="product-image">
            Product Image
        </div>

        <h2>Wireless Headphones</h2>

        <p>Comfortable and stylish headphones.</p>

        <p class="price">₹1999</p>

        <button>Buy Now</button>
    </div>

</body>
</html>
