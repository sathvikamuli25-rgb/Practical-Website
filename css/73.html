<!DOCTYPE html>
<html>
<head>
    <title>CSS Clamp Min Max</title>

    <style>
        body {
            font-family: Arial;
            text-align: center;
        }

        h1 {
            font-size: clamp(24px, 5vw, 50px);
        }

        .box {
            width: min(80%, 500px);
            min-height: 200px;
            max-width: 600px;
            margin: 30px auto;
            padding: 30px;
            background-color: lightblue;
        }
    </style>
</head>

<body>

    <h1>Clamp Min Max</h1>

    <div class="box">
        <p>This box uses min(), max(), and clamp().</p>
    </div>

</body>
</html>
