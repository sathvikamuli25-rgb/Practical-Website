<!DOCTYPE html>
<html>
<head>
    <title>CSS Z-Index</title>

    <style>
        .box1 {
            width: 200px;
            height: 200px;
            background-color: blue;
            position: absolute;
            top: 100px;
            left: 100px;
            z-index: 1;
        }

        .box2 {
            width: 200px;
            height: 200px;
            background-color: red;
            position: absolute;
            top: 150px;
            left: 150px;
            z-index: 2;
        }
    </style>
</head>

<body>

    <h1>CSS Z-Index</h1>

    <div class="box1"></div>
    <div class="box2"></div>

</body>
</html>
