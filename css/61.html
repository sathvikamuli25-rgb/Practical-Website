<!DOCTYPE html>
<html>
<head>
    <title>Flexbox Alignment and Ordering</title>

    <style>
        .container {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            height: 300px;
        }

        .box {
            width: 100px;
            padding: 30px;
            background-color: lightblue;
            text-align: center;
        }

        .box1 {
            order: 3;
        }

        .box2 {
            order: 1;
        }

        .box3 {
            order: 2;
        }
    </style>
</head>

<body>

    <h1>Flexbox Alignment and Ordering</h1>

    <div class="container">
        <div class="box box1">Box 1</div>
        <div class="box box2">Box 2</div>
        <div class="box box3">Box 3</div>
    </div>

</body>
</html>
