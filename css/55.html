<!DOCTYPE html>
<html>
<head>
    <title>Responsive College Website</title>

    <style>
        body {
            margin: 0;
            font-family: Arial;
        }

        header {
            background-color: blue;
            color: white;
            padding: 25px;
            text-align: center;
        }

        nav {
            background-color: black;
            padding: 15px;
            text-align: center;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin: 15px;
        }

        .container {
            display: flex;
            gap: 20px;
            padding: 30px;
        }

        .box {
            flex: 1;
            padding: 30px;
            background-color: lightblue;
            text-align: center;
        }

        footer {
            background-color: black;
            color: white;
            text-align: center;
            padding: 20px;
        }

        @media (max-width: 600px) {
            .container {
                flex-direction: column;
            }

            nav a {
                display: block;
                margin: 10px;
            }
        }
    </style>
</head>

<body>

    <header>
        <h1>ABC College</h1>
        <p>Welcome to our college website</p>
    </header>

    <nav>
        <a href="#">Home</a>
        <a href="#">Courses</a>
        <a href="#">About</a>
        <a href="#">Contact</a>
    </nav>

    <div class="container">
        <div class="box">
            <h2>Courses</h2>
            <p>Engineering and Technology</p>
        </div>

        <div class="box">
            <h2>Facilities</h2>
            <p>Library, Labs and Sports</p>
        </div>

        <div class="box">
            <h2>Admissions</h2>
            <p>Apply for admission today</p>
        </div>
    </div>

    <footer>
        <p>© 2026 ABC College</p>
    </footer>

</body>
</html>
