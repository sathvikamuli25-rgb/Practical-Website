<!DOCTYPE html>
<html>
<head>
    <title>CSS Tooltip</title>

    <style>
        .tooltip {
            position: relative;
            display: inline-block;
            margin: 50px;
        }

        .tooltip-text {
            visibility: hidden;
            background-color: black;
            color: white;
            padding: 8px;
            position: absolute;
            bottom: 120%;
            left: 50%;
            transform: translateX(-50%);
            white-space: nowrap;
        }

        .tooltip:hover .tooltip-text {
            visibility: visible;
        }
    </style>
</head>

<body>

    <h1>CSS Tooltip</h1>

    <div class="tooltip">
        Hover over me
        <span class="tooltip-text">This is a tooltip</span>
    </div>

</body>
</html>
