<!DOCTYPE html>
<html>
<head>
    <title>Responsive Typography</title>

    <style>
        body {
            font-family: Arial;
            text-align: center;
        }

        h1 {
            font-size: 5vw;
        }

        p {
            font-size: 2vw;
        }

        @media (max-width: 600px) {
            h1 {
                font-size: 10vw;
            }

            p {
                font-size: 5vw;
            }
        }
    </style>
</head>

<body>

    <h1>Responsive Typography</h1>

    <p>This text changes size according to the screen width.</p>

</body>
</html>
