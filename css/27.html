<!DOCTYPE html>
<html>
<head>
    <title>CSS Selectors</title>

    <style>
        * {
            font-family: Arial;
        }

        h1 {
            color: blue;
        }

        .class-selector {
            color: green;
        }

        #id-selector {
            color: red;
        }

        input[type="text"] {
            border: 2px solid purple;
        }

        h2, p {
            background-color: lightgray;
            padding: 10px;
        }
    </style>
</head>

<body>

    <h1>CSS Selectors</h1>

    <h2>Element Selector</h2>

    <p class="class-selector">Class Selector</p>

    <p id="id-selector">ID Selector</p>

    <input type="text" placeholder="Attribute Selector">

    <p>Grouping Selector</p>

</body>
</html>
