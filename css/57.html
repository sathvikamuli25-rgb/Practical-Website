<!DOCTYPE html>
<html>
<head>
    <title>Shopping Webpage</title>

    <style>
        body {
            margin: 0;
            font-family: Arial;
        }

        header {
            background-color: blue;
            color: white;
            padding: 25px;
            text-align: center;
        }

        .products {
            display: flex;
            justify-content: center;
            gap: 20px;
            padding: 30px;
            flex-wrap: wrap;
        }

        .product {
            width: 250px;
            padding: 20px;
            border: 1px solid gray;
            text-align: center;
            border-radius: 10px;
        }

        .product img {
            width: 100%;
            height: 180px;
            object-fit: cover;
        }

        button {
            background-color: blue;
            color: white;
            padding: 10px 20px;
            border: none;
        }

        @media (max-width: 600px) {
            .product {
                width: 90%;
            }
        }
    </style>
</head>

<body>

    <header>
        <h1>Online Shopping</h1>
    </header>

    <div class="products">

        <div class="product">
            <img src="https://picsum.photos/250/180?1" alt="Product 1">
            <h2>Smart Watch</h2>
            <p>₹1500</p>
            <button>Buy Now</button>
        </div>

        <div class="product">
            <img src="https://picsum.photos/250/180?2" alt="Product 2">
            <h2>Headphones</h2>
            <p>₹2000</p>
            <button>Buy Now</button>
        </div>

        <div class="product">
            <img src="https://picsum.photos/250/180?3" alt="Product 3">
            <h2>Backpack</h2>
            <p>₹1200</p>
            <button>Buy Now</button>
        </div>

    </div>

</body>
</html>
