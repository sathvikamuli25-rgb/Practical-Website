<!DOCTYPE html>
<html>
<head>
    <title>CSS Overflow</title>

    <style>
        .box {
            width: 300px;
            height: 150px;
            border: 2px solid black;
            overflow: auto;
            padding: 10px;
        }
    </style>
</head>

<body>

    <h1>CSS Overflow</h1>

    <div class="box">
        This is an example of CSS overflow. 
        When the content is larger than the given width or height,
        the overflow property controls how the extra content is displayed.
        Scrollbars appear when required.
    </div>

</body>
</html>
