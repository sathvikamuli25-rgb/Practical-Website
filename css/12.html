<!DOCTYPE html>
<html>
<head>
<style>
    ul {
        list-style-type: square;
    }

    table {
        border-collapse: collapse;
    }

    th, td {
        border: 1px solid black;
        padding: 10px;
    }

    th {
        background-color: lightblue;
    }
</style>
</head>

<body>

<h2>My Subjects</h2>

<ul>
    <li>HTML</li>
    <li>CSS</li>
    <li>Java</li>
</ul>

<h2>Marks</h2>

<table>
    <tr>
        <th>Subject</th>
        <th>Marks</th>
    </tr>
    <tr>
        <td>HTML</td>
        <td>90</td>
    </tr>
    <tr>
        <td>CSS</td>
        <td>85</td>
    </tr>
</table>

</body>
</html>
