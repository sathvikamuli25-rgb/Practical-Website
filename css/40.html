<!DOCTYPE html>
<html>
<head>
    <title>CSS Image Hover Effect</title>

    <style>
        .image {
            width: 300px;
            transition: 0.5s;
        }

        .image:hover {
            transform: scale(1.1);
            opacity: 0.7;
        }
    </style>
</head>

<body>

    <h1>CSS Image Hover Effect</h1>

    <img class="image" src="https://picsum.photos/300/200" alt="Sample Image">

</body>
</html>
