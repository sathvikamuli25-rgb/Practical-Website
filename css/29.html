<!DOCTYPE html>
<html>
<head>
    <title>CSS Variables</title>

    <style>
        :root {
            --main-color: blue;
            --box-color: lightblue;
            --padding: 20px;
        }

        h1 {
            color: var(--main-color);
        }

        .box {
            background-color: var(--box-color);
            padding: var(--padding);
            margin: 20px;
        }

        button {
            background-color: var(--main-color);
            color: white;
            padding: 10px 20px;
            border: none;
        }
    </style>
</head>

<body>

    <h1>CSS Variables</h1>

    <div class="box">
        <p>This box uses CSS variables.</p>
        <button>Click Me</button>
    </div>

</body>
</html>
