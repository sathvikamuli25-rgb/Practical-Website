<!DOCTYPE html>
<html>
<head>
    <title>CSS Transitions</title>

    <style>
        .box {
            width: 200px;
            height: 100px;
            background-color: lightblue;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: 0.5s;
        }

        .box:hover {
            width: 300px;
            background-color: purple;
            color: white;
        }
    </style>
</head>

<body>

    <h1>CSS Transitions</h1>

    <div class="box">
        Hover Me
    </div>

</body>
</html>
