<!DOCTYPE html>
<html>
<head>
    <title>Responsive Gallery</title>

    <style>
        .gallery {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            justify-content: center;
        }

        .gallery img {
            width: 300px;
            height: 200px;
            object-fit: cover;
        }

        @media (max-width: 600px) {
            .gallery img {
                width: 100%;
            }
        }
    </style>
</head>

<body>

    <h1>Responsive Gallery</h1>

    <div class="gallery">
        <img src="https://picsum.photos/300/200?1" alt="Image 1">
        <img src="https://picsum.photos/300/200?2" alt="Image 2">
        <img src="https://picsum.photos/300/200?3" alt="Image 3">
        <img src="https://picsum.photos/300/200?4" alt="Image 4">
    </div>

</body>
</html>
