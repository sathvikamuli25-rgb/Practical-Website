<!DOCTYPE html>
<html>
<head>
    <title>CSS Opacity and Transparency</title>

    <style>
        .box {
            width: 300px;
            padding: 40px;
            margin: 50px auto;
            background-color: blue;
            color: white;
            text-align: center;
            opacity: 0.5;
        }

        .transparent {
            background-color: rgba(255, 0, 0, 0.5);
            width: 300px;
            padding: 40px;
            margin: 20px auto;
            text-align: center;
        }
    </style>
</head>

<body>

    <h1>CSS Opacity and Transparency</h1>

    <div class="box">
        Opacity Example
    </div>

    <div class="transparent">
        Transparency Example
    </div>

</body>
</html>
