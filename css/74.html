<!DOCTYPE html>
<html>
<head>
    <title>CSS Calc</title>

    <style>
        body {
            font-family: Arial;
            text-align: center;
        }

        .box {
            width: calc(100% - 100px);
            height: calc(100vh - 200px);
            margin: 50px;
            padding: 20px;
            background-color: lightgreen;
            box-sizing: border-box;
        }
    </style>
</head>

<body>

    <h1>CSS calc()</h1>

    <div class="box">
        <p>This box uses the calc() function.</p>
    </div>

</body>
</html>
