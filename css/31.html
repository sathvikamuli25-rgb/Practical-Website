<!DOCTYPE html>
<html>
<head>
    <title>CSS Gradients</title>

    <style>
        body {
            font-family: Arial;
        }

        .box {
            width: 300px;
            height: 150px;
            margin: 30px auto;
            background: linear-gradient(to right, blue, purple);
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 24px;
        }
    </style>
</head>

<body>

    <h1>CSS Gradients</h1>

    <div class="box">
        Gradient Box
    </div>

</body>
</html>
