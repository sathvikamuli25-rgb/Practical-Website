<!DOCTYPE html>
<html>
<head>
    <title>CSS Shadows</title>

    <style>
        .box {
            width: 300px;
            padding: 30px;
            margin: 50px auto;
            text-align: center;
            background-color: white;
            box-shadow: 5px 5px 15px gray;
        }

        h1 {
            text-shadow: 2px 2px 5px gray;
        }
    </style>
</head>

<body>

    <div class="box">
        <h1>CSS Shadows</h1>
        <p>This box uses box-shadow.</p>
    </div>

</body>
</html>
