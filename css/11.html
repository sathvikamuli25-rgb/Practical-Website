<!DOCTYPE html>
<html>
<head>
<style>
    h1::before {
        content: "★ ";
    }

    h1::after {
        content: " ★";
    }

    p::first-letter {
        font-size: 30px;
    }

    p::first-line {
        font-weight: bold;
    }
</style>
</head>

<body>

<h1>Pseudo Elements</h1>

<p>
    This is an example of pseudo elements.
    They can style parts of an element.
</p>

</body>
</html>
