<!DOCTYPE html>
<html>
<head>
    <title>Travel Homepage</title>

    <style>
        body {
            margin: 0;
            font-family: Arial;
        }

        header {
            background-image: url("https://picsum.photos/1200/500");
            background-size: cover;
            background-position: center;
            color: white;
            text-align: center;
            padding: 120px 20px;
        }

        header h1 {
            font-size: 45px;
        }

        .places {
            display: flex;
            justify-content: center;
            gap: 20px;
            padding: 30px;
            flex-wrap: wrap;
        }

        .place {
            width: 250px;
            padding: 20px;
            background-color: lightblue;
            text-align: center;
            border-radius: 10px;
        }

        button {
            padding: 10px 20px;
            background-color: blue;
            color: white;
            border: none;
        }

        @media (max-width: 600px) {
            header h1 {
                font-size: 30px;
            }

            .place {
                width: 90%;
            }
        }
    </style>
</head>

<body>

    <header>
        <h1>Explore the World</h1>
        <p>Discover beautiful places and amazing experiences</p>
        <button>Explore Now</button>
    </header>

    <div class="places">

        <div class="place">
            <h2>Paris</h2>
            <p>Experience the beauty of France.</p>
        </div>

        <div class="place">
            <h2>Dubai</h2>
            <p>Enjoy modern attractions and luxury.</p>
        </div>

        <div class="place">
            <h2>Maldives</h2>
            <p>Relax on beautiful beaches.</p>
        </div>

    </div>

</body>
</html>
