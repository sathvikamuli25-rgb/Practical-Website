<!DOCTYPE html>
<html>
<head>
<style>
    .static {
        position: static;
    }

    .relative {
        position: relative;
        left: 30px;
    }

    .absolute {
        position: absolute;
        top: 100px;
        right: 20px;
    }

    .fixed {
        position: fixed;
        bottom: 10px;
        right: 10px;
    }

    .sticky {
        position: sticky;
        top: 0;
        background: yellow;
    }
</style>
</head>

<body>

<p class="static">Static</p>
<p class="relative">Relative</p>
<p class="absolute">Absolute</p>
<p class="sticky">Sticky</p>
<p class="fixed">Fixed</p>

</body>
</html>
