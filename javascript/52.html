<!DOCTYPE html>
<html>
<head>
    <title>Perfect Number</title>
</head>
<body>

<script>
let num = 28;
let sum = 0;

for (let i = 1; i < num; i++) {
    if (num % i == 0) {
        sum = sum + i;
    }
}

if (sum == num) {
    document.write("Perfect number");
} else {
    document.write("Not a perfect number");
}
</script>

</body>
</html>
