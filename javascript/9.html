<!DOCTYPE html>
<html>
<head>
    <title>Palindrome</title>
</head>
<body>

<script>
    let num = 121;
    let original = num;
    let reverse = 0;

    while (num > 0) {
        let digit = num % 10;
        reverse = reverse * 10 + digit;
        num = Math.floor(num / 10);
    }

    if (original == reverse) {
        document.write("Palindrome number");
    } else {
        document.write("Not a palindrome number");
    }
</script>

</body>
</html>
