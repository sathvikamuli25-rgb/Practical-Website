<!DOCTYPE html>
<html>
<head>
    <title>Largest and Smallest</title>
</head>
<body>

<script>
    let arr = [10, 5, 25, 8, 15];

    let largest = Math.max(...arr);
    let smallest = Math.min(...arr);

    document.write("Largest: " + largest + "<br>");
    document.write("Smallest: " + smallest);
</script>

</body>
</html>
