<!DOCTYPE html>
<html>
<head>
    <title>Positive Negative Zero</title>
</head>
<body>

<script>
    let num = -5;

    if (num > 0) {
        document.write("Positive number");
    } else if (num < 0) {
        document.write("Negative number");
    } else {
        document.write("Zero");
    }
</script>

</body>
</html>
