<!DOCTYPE html>
<html>
<head>
    <title>API Data</title>
</head>
<body>

<ul id="list"></ul>

<script>
fetch("https://jsonplaceholder.typicode.com/users")
    .then(response => response.json())
    .then(data => {
        data.forEach(user => {
            let li = document.createElement("li");
            li.innerHTML = user.name;
            document.getElementById("list").appendChild(li);
        });
    });
</script>

</body>
</html>
