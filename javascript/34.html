<!DOCTYPE html>
<html>
<head>
    <title>Counter</title>
</head>
<body>

<h1 id="count">0</h1>

<button onclick="decrease()">-</button>
<button onclick="increase()">+</button>

<script>
let count = 0;

function increase() {
    count++;
    document.getElementById("count").innerHTML = count;
}

function decrease() {
    count--;
    document.getElementById("count").innerHTML = count;
}
</script>

</body>
</html>
