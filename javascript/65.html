<!DOCTYPE html>
<html>
<head>
    <title>Character Frequency</title>
</head>
<body>

<script>
let text = "hello";
let frequency = {};

for (let char of text) {
    frequency[char] = (frequency[char] || 0) + 1;
}

for (let char in frequency) {
    document.write(char + " : " + frequency[char] + "<br>");
}
</script>

</body>
</html>
