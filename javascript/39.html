<!DOCTYPE html>
<html>
<head>
    <title>Spread and Rest</title>
</head>
<body>

<script>
let a = [1, 2, 3];
let b = [4, 5, 6];

let c = [...a, ...b];

function add(...numbers) {
    return numbers.reduce((sum, n) => sum + n, 0);
}

document.write("Array: " + c + "<br>");
document.write("Sum: " + add(10, 20, 30));
</script>

</body>
</html>
