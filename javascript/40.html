<!DOCTYPE html>
<html>
<head>
    <title>Classes and Objects</title>
</head>
<body>

<script>
class Student {
    constructor(name, age) {
        this.name = name;
        this.age = age;
    }

    display() {
        document.write("Name: " + this.name + "<br>");
        document.write("Age: " + this.age);
    }
}

let student = new Student("Sathvika", 20);
student.display();
</script>

</body>
</html>
