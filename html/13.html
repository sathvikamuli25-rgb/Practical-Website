<!DOCTYPE html>
<html>
<head>
    <title>Responsive Webpage</title>

    <style>
        body {
            font-family: Arial;
            margin: 0;
        }

        .container {
            padding: 30px;
            text-align: center;
        }

        .box {
            padding: 30px;
            background-color: lightblue;
            font-size: 25px;
        }

        @media (max-width: 600px) {
            .box {
                background-color: lightgreen;
                font-size: 18px;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Responsive Webpage</h1>

        <div class="box">
            Resize the browser window to see the change.
        </div>
    </div>

</body>
</html>
