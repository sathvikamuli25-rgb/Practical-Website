<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML Program</title>
    <link rel="stylesheet" href="viewer-style.css">
</head>

<body>

<header>
    <a href="index.html" class="back-btn">← Back to HTML Programs</a>
    <h1 id="title">HTML Program</h1>
</header>

<div class="tabs">
    <button onclick="showCode()">Source Code</button>
    <button onclick="showOutput()">Output</button>
</div>

<div class="container">

    <div id="codeBox">
        <pre id="code">Loading...</pre>
    </div>

    <div id="outputBox">
        <iframe id="output"></iframe>
    </div>

</div>

<script>
    const params = new URLSearchParams(window.location.search);
    const file = params.get("file");

    // Check whether a file was provided
    if (!file) {
        document.getElementById("title").textContent = "Program Not Found";
        document.getElementById("code").textContent =
            "No HTML program was selected.";
    } else {

        const number = file.replace(".html", "");

        document.getElementById("title").textContent =
            "HTML Program " + number;

        // Load source code
        fetch(file)
            .then(response => {
                if (!response.ok) {
                    throw new Error("File not found");
                }
                return response.text();
            })
            .then(data => {
                document.getElementById("code").textContent = data;
            })
            .catch(error => {
                document.getElementById("code").textContent = "Error loading source code.";
            });
    }
</script>
